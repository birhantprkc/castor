name: continuous-integration

on:
  push:
    paths-ignore: ['docs/**']
    branches-ignore: ['main']
  pull_request:
    branches: ['**']
    paths-ignore: ['docs/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: ./.github/actions/setup
      - run: eval "$(make env)" && ./scripts/tested.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: ./.github/actions/setup
      - run: eval "$(make env)" && go vet ./...
      # Pinned, not @latest: a lint gate that changes under CI turns an unrelated
      # push red and teaches everyone to ignore it. It runs under make env because
      # the repo is cgo and staticcheck type-checks the whole graph.
      - run: eval "$(make env)" && go run honnef.co/go/tools/cmd/staticcheck@2026.2.1 ./internal/... ./cmd/...
      # -test is load-bearing: without it every function only a test reaches reads
      # as dead. deadcode exits 0 whether or not it found anything, so the gate is
      # its output and not its status. One line is allowed through: castorNativeLog
      # carries //export and nativelog.c installs it as whisper.cpp's global log
      # callback, so its only caller is C and no Go callgraph can see it.
      - run: |
          eval "$(make env)"
          dead=$(go run golang.org/x/tools/cmd/deadcode@v0.50.0 -test ./... 2>&1 | grep -v '^internal/subtitle/whisper/nativelog.go:[0-9]*:[0-9]*: unreachable func: castorNativeLog$' || true)
          [ -z "$dead" ] || { printf 'unreachable:\n%s\n' "$dead"; exit 1; }
      # go fix carries the modernizers since Go 1.26, so the gate moves with the
      # toolchain go.mod pins instead of a second version to keep in step. Any
      # suggested rewrite fails the job: run `go fix ./...` and commit it.
      - run: |
          eval "$(make env)"
          fixes=$(go fix -diff ./... 2>&1)
          [ -z "$fixes" ] || { printf 'go fix:\n%s\n' "$fixes"; exit 1; }
      - run: |
          unformatted=$(gofmt -s -l cmd internal e2e main.go)
          [ -z "$unformatted" ] || { printf 'unformatted:\n%s\n' "$unformatted"; exit 1; }

  # The contract: lint and format the protos, refuse breaking changes against
  # main, and fail when the committed gen/ differs from what the protos produce.
  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: bufbuild/buf-action@85aebf73123b5c15fd5528aaecbf9129cddf7fa7 # v1.6.0
        with:
          version: 1.73.0
          setup_only: true
      - run: buf lint && buf format -d --exit-code
      - run: buf breaking --against "https://github.com/${GITHUB_REPOSITORY}.git#branch=main"
      - run: make generate && test -z "$(git status --porcelain -- gen)"
