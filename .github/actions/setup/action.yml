name: Setup
description: Go toolchain, the media tools, and cached libwhisper.a for the cgo build

runs:
  using: composite
  steps:
    - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
      with:
        go-version-file: go.mod
    # The runner image carries no ffmpeg, and castor's real-encode tests skip
    # themselves when they cannot find one. t.Skip is green, so the whole of that
    # coverage was absent from CI without a single line saying so. scripts/tested.sh
    # is the other half of this: it fails the run if they skip again.
    - shell: bash
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
    - id: whisper
      shell: bash
      run: echo "rev=$(git -C third_party/whisper.cpp rev-parse HEAD)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: third_party/whisper.cpp/build_go
        key: libwhisper-${{ runner.os }}-${{ steps.whisper.outputs.rev }}
    - shell: bash
      run: make build && go mod download
