# A bare variant playlist taller than max_height is not handed over as is: it is relayed and scaled (#56).
stream:
  packaging: hls-ts
  video: {codec: h264, height: 360}
  audio: {codec: aac, channels: 2}
receiver:
  device: chromecast
castor:
  cast:
    max_height: 240
expect:
  delivery: served
  video: encoded
