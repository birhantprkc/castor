# A phone's portrait clip is stored landscape with a rotation tag; copied into MPEG-TS the tag is lost and the TV shows it sideways.
stream:
  packaging: file-mp4
  video: {codec: h264, height: 360}
  audio: {codec: aac, channels: 2}
  quirks:
    rotated: 90
receiver:
  device:
    dlna:
      sink: "http-get:*:video/mp2t:DLNA.ORG_PN=AVC_TS_HD_NA_ISO,http-get:*:audio/mp4:DLNA.ORG_PN=AAC_ISO"
      decodes:
        video: {h264: 8}
        audio: {aac: 2}
expect:
  delivery: served
  video: encoded
