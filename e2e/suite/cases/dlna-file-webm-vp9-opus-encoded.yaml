# WebM with VP9 and Opus reaches an H.264 TV as H.264 with stereo AAC.
stream:
  packaging: file-webm
  video: {codec: vp9, height: 360}
  audio: {codec: opus, channels: 2}
receiver:
  device:
    dlna:
      sink: "http-get:*:video/mp2t:DLNA.ORG_PN=AVC_TS_HD_NA_ISO,http-get:*:audio/mp4:DLNA.ORG_PN=AAC_ISO"
      decodes:
        video: {h264: 8}
        audio: {aac: 2}
expect:
  delivery: served
  video: encoded
