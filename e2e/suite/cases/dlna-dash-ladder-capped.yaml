# A DASH ladder is narrowed to the representation max_height selects.
stream:
  packaging: dash
  video: {codec: h264, ladder: [240, 480]}
  audio: {codec: aac, channels: 2, carriage: separate}
receiver:
  device:
    dlna:
      sink: "http-get:*:video/mp2t:DLNA.ORG_PN=AVC_TS_HD_NA_ISO,http-get:*:audio/mp4:DLNA.ORG_PN=AAC_ISO"
      decodes:
        video: {h264: 8}
        audio: {aac: 2}
castor:
  cast:
    max_height: 360
expect:
  delivery: served
  video: copied
