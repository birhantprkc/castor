# A page's MP4 whose bucket serves it as binary/octet-stream is still cast, as browsers play it regardless.
command: player
stream:
  packaging: file-mp4
  video: {codec: h264, height: 240}
  audio: {codec: aac, channels: 2}
  segments: {served_as: binary/octet-stream}
  seconds: 300
receiver:
  device:
    dlna:
      sink: "http-get:*:video/mp2t:DLNA.ORG_PN=AVC_TS_HD_NA_ISO,http-get:*:audio/mp4:DLNA.ORG_PN=AAC_ISO"
      decodes:
        video: {h264: 8}
        audio: {aac: 2}
expect:
  delivery: served
  video: copied
