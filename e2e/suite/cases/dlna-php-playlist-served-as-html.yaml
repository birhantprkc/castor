# A playlist a PHP endpoint serves as text/html, with no .m3u8 in its URL, is still HLS and still casts.
stream:
  packaging: hls-ts
  entry: {path: "playlist.php?id=42", served_as: "text/html; charset=UTF-8"}
  video: {codec: h264, height: 360}
  audio: {codec: aac, channels: 2}
receiver:
  device:
    dlna:
      sink: "http-get:*:video/mp2t:DLNA.ORG_PN=AVC_TS_HD_NA_ISO,http-get:*:audio/mp4:DLNA.ORG_PN=AAC_ISO"
      decodes:
        video: {h264: 8}
        audio: {aac: 2}
expect:
  delivery: served
  video: copied
