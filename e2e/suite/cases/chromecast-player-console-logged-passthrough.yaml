# A stream a page only names in its console is handed to a Chromecast as is, since no request of the page's ever carried it.
command:
  player:
    stream: {logged: '[hls] attaching source %s'}
stream:
  packaging: hls-ts
  video: {codec: h264, height: 360}
  audio: {codec: aac, channels: 2}
  seconds: 300
receiver:
  device: chromecast
expect:
  delivery: passthrough
  video: copied
