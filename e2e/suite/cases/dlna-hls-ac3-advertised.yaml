# A TV that advertised AC-3 gets 5.1 AC-3 as it is.
stream:
  packaging: hls-ts
  video: {codec: h264, height: 360}
  audio: {codec: ac3, channels: 6}
receiver:
  device:
    dlna:
      sink: "http-get:*:video/mp2t:DLNA.ORG_PN=AVC_TS_HD_NA_ISO,http-get:*:audio/mp4:DLNA.ORG_PN=AAC_ISO,http-get:*:audio/vnd.dolby.dd-raw:DLNA.ORG_PN=AC3,http-get:*:audio/eac3:DLNA.ORG_PN=EAC3"
      decodes:
        video: {h264: 8}
        audio: {aac: 2, ac3: 6, eac3: 6}
expect:
  delivery: served
  video: copied
  channels: 6
