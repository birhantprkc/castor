# A TV gets the rendition max_height selects, copied.
stream:
  packaging: hls-ts
  video: {codec: h264, ladder: [240, 480, 720]}
  audio: {codec: aac, channels: 2}
receiver:
  device:
    dlna:
      sink: "http-get:*:video/mp2t:DLNA.ORG_PN=AVC_TS_HD_NA_ISO,http-get:*:audio/mp4:DLNA.ORG_PN=AAC_ISO"
      decodes:
        video: {h264: 8}
        audio: {aac: 2}
castor:
  resolver:
    max_height: 480
expect:
  delivery: served
  video: copied
