# Segments served as .jpg/image/jpeg only open for a lenient reader, so castor relays them (#53),
# and the stereo AAC it copies from TS into MP4 must keep its sound (#56).
stream:
  packaging: hls-ts
  video: {codec: h264, height: 360}
  audio: {codec: aac, channels: 2}
  segments: {extension: .jpg, served_as: image/jpeg}
receiver:
  device: chromecast
expect:
  delivery: served
  video: copied
