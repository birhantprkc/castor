# A live CDN that renews its session cookie on every playlist reload and refuses segments read with a stale one: the cast keeps the session fresh to the end.
stream:
  packaging: hls-ts
  video: {codec: h264, height: 360}
  audio: {codec: aac, channels: 2}
  seconds: 20
origin:
  rotates-cookie: {}
  live: {start: 4, every: 1s, end: endlist}
receiver:
  device:
    dlna:
      sink: "http-get:*:video/mp2t:DLNA.ORG_PN=AVC_TS_HD_NA_ISO,http-get:*:audio/mp4:DLNA.ORG_PN=AAC_ISO"
      decodes:
        video: {h264: 8}
        audio: {aac: 2}
expect:
  delivery: served
