# An fMP4 ad pod whose creative brings its own 720p init is spliced mid-film: every picture must decode, and the film keep its length.
stream:
  packaging: hls-fmp4
  video: {codec: h264, height: 360}
  audio: {codec: aac, channels: 2}
  seconds: 12
origin:
  splices-ad: {after: 4, segments: 3, height: 720}
receiver:
  device:
    dlna:
      sink: "http-get:*:video/mp2t:DLNA.ORG_PN=AVC_TS_HD_NA_ISO,http-get:*:audio/mp4:DLNA.ORG_PN=AAC_ISO"
      decodes:
        video: {h264: 8}
        audio: {aac: 2}
castor:
  cast:
    max_height: 480
expect:
  delivery: served
