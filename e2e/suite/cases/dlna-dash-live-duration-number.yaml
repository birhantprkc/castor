# A live DASH presentation addressed by $Number$ over a fixed segment duration, with no timeline listing what exists: castor works out the edge from the clock.
stream:
  packaging: dash-duration
  video: {codec: h264, height: 360}
  audio: {codec: aac, channels: 2, carriage: separate}
  seconds: 20
origin:
  dash-live: {start: 4, every: 1s}
receiver:
  device:
    dlna:
      sink: "http-get:*:video/mp2t:DLNA.ORG_PN=AVC_TS_HD_NA_ISO,http-get:*:audio/mp4:DLNA.ORG_PN=AAC_ISO"
      decodes:
        video: {h264: 8}
        audio: {aac: 2}
expect:
  delivery: served
