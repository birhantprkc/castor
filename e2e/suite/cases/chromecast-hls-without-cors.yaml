# An HLS source whose CDN sends no CORS headers is refused by the Cast receiver, so castor relays it instead.
stream:
  packaging: hls-ts
  video: {codec: h264, height: 360}
  audio: {codec: aac, channels: 2}
receiver:
  device: {chromecast: {cors: enforced}}
expect:
  delivery: served
  video: copied
