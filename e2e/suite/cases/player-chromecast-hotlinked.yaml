# A stream only its page may fetch is relayed with the page's headers, never handed to a Chromecast that has none (#53).
command: player
stream:
  packaging: hls-ts
  video: {codec: h264, height: 240}
  audio: {codec: aac, channels: 2}
  seconds: 300
origin:
  requires-referer: {}
receiver:
  device: chromecast
expect:
  delivery: served
  video: copied
