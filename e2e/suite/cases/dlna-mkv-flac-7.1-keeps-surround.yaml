# A Blu-ray remux carries 7.1 FLAC; a TV that advertised AC-3 should get 5.1 AC-3, not a stereo fold-down made before castor looked at the TV.
stream:
  packaging: file-mkv
  video: {codec: h264, height: 360}
  audio: {codec: flac, channels: 8}
receiver:
  device:
    dlna:
      sink: "http-get:*:video/mp2t:DLNA.ORG_PN=AVC_TS_HD_NA_ISO,http-get:*:audio/mp4:DLNA.ORG_PN=AAC_ISO,http-get:*:audio/vnd.dolby.dd-raw:DLNA.ORG_PN=AC3"
      decodes:
        video: {h264: 8}
        audio: {aac: 2, ac3: 6}
expect:
  delivery: served
  video: copied
  channels: 6
