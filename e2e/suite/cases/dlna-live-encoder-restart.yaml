# A live playlist whose encoder reconnects mid-cast restarts at media sequence 0 with fresh timestamps; the cast follows it to the end.
stream:
  packaging: hls-ts
  video: {codec: h264, height: 360}
  audio: {codec: aac, channels: 2}
  seconds: 20
origin:
  restarts-at: {segment: 10, sequence: reset}
  live: {start: 4, every: 1s, end: endlist}
receiver:
  device:
    dlna:
      sink: "http-get:*:video/mp2t:DLNA.ORG_PN=AVC_TS_HD_NA_ISO,http-get:*:audio/mp4:DLNA.ORG_PN=AAC_ISO"
      decodes:
        video: {h264: 8}
        audio: {aac: 2}
expect:
  delivery: served
