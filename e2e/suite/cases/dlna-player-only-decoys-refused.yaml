# A page offering nothing castable, only a poster, a blob, an empty manifest and an ad, is refused cleanly (#60).
command:
  player:
    stream: withheld
    decoys: [image, blob, empty-playlist, ad-clip]
stream:
  packaging: hls-ts
  video: {codec: h264, height: 240}
  audio: {codec: aac, channels: 2}
receiver:
  device:
    dlna:
      sink: "http-get:*:video/mp2t:DLNA.ORG_PN=AVC_TS_HD_NA_ISO,http-get:*:audio/mp4:DLNA.ORG_PN=AAC_ISO"
      decodes:
        video: {h264: 8}
        audio: {aac: 2}
outcome: refused
