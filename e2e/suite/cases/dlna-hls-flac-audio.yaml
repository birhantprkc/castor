# FLAC audio cannot ride MPEG-TS, so castor re-encodes the sound for the TV and keeps the picture.
stream:
  packaging: hls-fmp4
  video: {codec: h264, height: 360}
  audio: {codec: flac, channels: 2}
receiver:
  device:
    dlna:
      sink: "http-get:*:video/mp2t:DLNA.ORG_PN=AVC_TS_HD_NA_ISO,http-get:*:audio/mp4:DLNA.ORG_PN=AAC_ISO"
      decodes:
        video: {h264: 8}
        audio: {aac: 2}
expect:
  delivery: served
  video: copied
