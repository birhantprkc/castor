# When every rendition is taller than max_height, castor reads the shortest and scales it down.
stream:
  packaging: hls-ts
  video: {codec: h264, ladder: [480, 720]}
  audio: {codec: aac, channels: 2}
receiver:
  device:
    dlna:
      sink: "http-get:*:video/mp2t:DLNA.ORG_PN=AVC_TS_HD_NA_ISO,http-get:*:audio/mp4:DLNA.ORG_PN=AAC_ISO"
      decodes:
        video: {h264: 8}
        audio: {aac: 2}
castor:
  cast:
    max_height: 240
expect:
  delivery: served
  video: encoded
