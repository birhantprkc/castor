# fMP4 segments that go quiet with a viewer watching end the cast, rather than pointing the TV somewhere else mid-title.
stream:
  packaging: hls-fmp4
  video: {codec: h264, height: 360}
  audio: {codec: aac, channels: 2}
  seconds: 60
origin:
  stalls-at: 10
receiver:
  device:
    dlna:
      sink: "http-get:*:video/mp2t:DLNA.ORG_PN=AVC_TS_HD_NA_ISO,http-get:*:audio/mp4:DLNA.ORG_PN=AAC_ISO"
      decodes:
        video: {h264: 8}
        audio: {aac: 2}
outcome: aborted
