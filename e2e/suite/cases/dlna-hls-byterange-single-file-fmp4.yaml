# Single-file fMP4 HLS (one .m4s addressed by EXT-X-BYTERANGE, init by a ranged EXT-X-MAP) casts to its full length.
stream:
  packaging: hls-fmp4-single-file
  video: {codec: h264, height: 360}
  audio: {codec: aac, channels: 2}
  seconds: 20
receiver:
  device:
    dlna:
      sink: "http-get:*:video/mp2t:DLNA.ORG_PN=AVC_TS_HD_NA_ISO,http-get:*:audio/mp4:DLNA.ORG_PN=AAC_ISO"
      decodes:
        video: {h264: 8}
        audio: {aac: 2}
expect:
  delivery: served
  video: copied
