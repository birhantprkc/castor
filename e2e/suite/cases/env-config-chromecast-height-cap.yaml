# A setting given as CASTOR_RESOLVER__MAX_HEIGHT binds the cast exactly as the file's key would (#64).
config: env
stream:
  packaging: hls-ts
  video: {codec: h264, height: 360}
  audio: {codec: aac, channels: 2}
receiver:
  device: chromecast
castor:
  resolver:
    max_height: 240
expect:
  delivery: served
  video: encoded
