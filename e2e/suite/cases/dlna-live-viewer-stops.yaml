# The viewer stops a live cast that has no end: castor exits cleanly at once.
stream:
  packaging: hls-ts
  video: {codec: h264, height: 360}
  audio: {codec: aac, channels: 2}
  seconds: 60
origin:
  live: {start: 4, every: 1s, end: silence}
receiver:
  device:
    dlna:
      sink: "http-get:*:video/mp2t:DLNA.ORG_PN=AVC_TS_HD_NA_ISO,http-get:*:audio/mp4:DLNA.ORG_PN=AAC_ISO"
      decodes:
        video: {h264: 8}
        audio: {aac: 2}
  viewer: {stops-after: 5s}
expect:
  delivery: served
