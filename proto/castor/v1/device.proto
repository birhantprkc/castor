syntax = "proto3";

package castor.v1;

import "buf/validate/validate.proto";

// DeviceService lends a client's device to a cast: its calls arrive through Drive and are answered through Answer.
service DeviceService {
  // Drive lends the device: a cast takes one, starts once it is lent, and plays on once its client leaves.
  rpc Drive(DriveRequest) returns (stream DriveResponse);
  rpc Answer(AnswerRequest) returns (AnswerResponse);
}

message DriveRequest {
  string cast_id = 1 [(buf.validate.field).string.min_len = 1];
  Device device = 2;
  // self_fetch is whether the device fetches a stream URL itself, known before connecting to it.
  bool self_fetch = 3;
}

message DriveResponse {
  DeviceCommand command = 1;
}

message AnswerRequest {
  string cast_id = 1 [(buf.validate.field).string.min_len = 1];
  string command_id = 2 [(buf.validate.field).string.min_len = 1];
  oneof answer {
    option (buf.validate.oneof).required = true;
    Done done = 3;
    Capabilities capabilities = 4;
    Headers headers = 5;
    DeviceError error = 6;
  }

  message Done {}

  message Headers {
    map<string, string> headers = 1 [(buf.validate.field).map = {
      keys: {
        string: {well_known_regex: KNOWN_REGEX_HTTP_HEADER_NAME}
      }
      values: {
        string: {
          well_known_regex: KNOWN_REGEX_HTTP_HEADER_VALUE
          strict: false
        }
      }
    }];
  }
}

message AnswerResponse {}

// Device is the lent device, sent for the server's logs.
message Device {
  string name = 1;
  string type = 2;
  string address = 3;
}

// Capabilities is what a renderer decodes natively and how it takes a stream.
message Capabilities {
  repeated string containers = 1;
  repeated VideoSupport video = 2;
  repeated AudioSupport audio = 3;
  // served_container is what a served cast that remuxes is muxed into.
  string served_container = 4;
  bool deinterlaces = 5;
}

message VideoSupport {
  string codec = 1;
  repeated string profiles = 2;
  repeated uint32 bit_depths = 3;
  uint32 max_level = 4;
}

message AudioSupport {
  string codec = 1;
  uint32 max_channels = 2;
}

// DeviceCommand is one call the server's cast makes on the client's renderer.
message DeviceCommand {
  option (buf.validate.message).cel = {
    id: "device_command.id"
    message: "id is set on every command but cancel, and empty on cancel"
    expression: "has(this.cancel) == (this.id == '')"
  };

  string id = 1;
  oneof command {
    option (buf.validate.oneof).required = true;
    // connect opens the lent device, closing the one this cast opened before.
    Connect connect = 2;
    Play play = 3;
    StreamHeaders stream_headers = 4;
    AwaitEnd await_end = 5;
    Close close = 6;
    // cancel abandons a command still running; it is never answered.
    Cancel cancel = 7;
  }

  message Connect {}

  message Play {
    // url is what the renderer fetches: the source itself, or what the server serves it.
    string url = 1;
    string content_type = 2;
  }

  message StreamHeaders {
    string content_type = 1;
  }

  message AwaitEnd {}

  message Close {}

  message Cancel {
    string command_id = 1;
  }
}

// DeviceError is a renderer's failure, typed where the server's recovery reads its kind.
message DeviceError {
  oneof error {
    option (buf.validate.oneof).required = true;
    string message = 1 [(buf.validate.field).string.min_len = 1];
    Gone gone = 2;
  }

  // Gone is a renderer established unreachable.
  message Gone {
    string renderer = 1;
    string observed = 2;
    string cause = 3;
  }
}
