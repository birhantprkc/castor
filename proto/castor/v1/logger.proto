syntax = "proto3";

package castor.v1;

import "buf/validate/validate.proto";

// LoggerService follows a cast without driving it.
service LoggerService {
  // Watch sends the cast's status now and on every change.
  rpc Watch(WatchRequest) returns (stream WatchResponse);
}

message WatchRequest {
  string cast_id = 1 [(buf.validate.field).string.min_len = 1];
  // logs is the least severe line sent; unset sends none.
  optional LogLevel logs = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
}

// WatchResponse is one update; the stream's own status is the outcome: OK ended, canceled stopped, aborted failed.
message WatchResponse {
  oneof update {
    CastStatus status = 1;
    LogLine line = 2;
  }
}

// CastStatus is where a cast stands; nothing decides on it, it is for people to read.
message CastStatus {
  // streams is how many streams the cast was handed, once it measures them.
  uint32 streams = 1;
  // castable is how many of them measuring kept.
  uint32 castable = 2;
  // attempt counts tries from 1, once casting.
  uint32 attempt = 3;
  // revision is the latest change of plan, unset before any.
  Revision revision = 4;

  message Revision {
    string strategy = 1;
    string why = 2;
  }
}

enum LogLevel {
  LOG_LEVEL_UNSPECIFIED = 0;
  LOG_LEVEL_DEBUG = 1;
  LOG_LEVEL_INFO = 2;
  LOG_LEVEL_WARN = 3;
  LOG_LEVEL_ERROR = 4;
}

// LogLine is one line the server logged for a cast, sent live and never kept.
message LogLine {
  LogLevel level = 1;
  string message = 2;
  // attrs are in logged order, group keys dotted.
  repeated Attr attrs = 3;

  message Attr {
    string key = 1;
    string value = 2;
  }
}
