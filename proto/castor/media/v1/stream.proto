syntax = "proto3";

package castor.media.v1;

import "buf/validate/validate.proto";
import "castor/v1/cast.proto";
import "castor/v1/stream.proto";

// StreamService ranks a source's streams as a cast would, without casting.
service StreamService {
  rpc Rank(RankRequest) returns (RankResponse);
}

message RankRequest {
  castor.v1.Source source = 1 [(buf.validate.field).required = true];
  // preferences are the cast's, every one of them set.
  castor.v1.Preferences preferences = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).cel = {
      id: "preferences.complete"
      message: "delivery, max_height and subtitles are all set"
      expression: "has(this.delivery) && has(this.max_height) && has(this.subtitles)"
    }
  ];
}

message RankResponse {
  // ranked is the order a cast walks the streams in, best first.
  repeated castor.v1.RankedStream ranked = 1;
}
