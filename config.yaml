# What identifies your install: the device, your sources and your opt-ins. Everything
# else has a working default; any key can be overridden with CASTOR_SECTION__FIELD.

device:
  # Run `castor scan` and paste the device's name and type (dlna, chromecast or roku).
  name: "Samsung Q80CA 55 TV"
  type: "dlna"
  # Reach the device by unicast where discovery can't (VLANs, Android/Termux); name becomes a label.
  # Its IP, or for a DLNA device that does not answer there, its description URL.
  # host: 192.168.0.3

cast:
  # auto (the default) hands a device that fetches for itself the source when it can play it;
  # serve always relays, for a source a device refuses. `--debug` logs which and why.
  # delivery: serve
  # The tallest picture sent to the device (default 1080). A taller source castor measured is
  # relayed and scaled down, re-encoding the whole title.
  # max_height: 1080
  # Burned-in subtitles: a whisper language code (en, fr) or auto; unset for none. Only devices
  # castor always streams to (DLNA) get them, never one that fetches for itself.
  # subtitles: en

sources:
  # Castor ships no sources: add sites you are authorized to use. `proxies` are base URLs tried
  # in order; `templates` map an IMDB or TMDB id to the site's movie and episode paths.
  - proxies:
      - "https://your-source.example"
    templates:
      movie: "/embed/movie/{itemID}"
      episode: "/embed/tv/{itemID}/{season}-{episode}"

  # Parameters can also go in a query string.
  - proxies:
      - "https://another-source.example"
    templates:
      movie: "/embed?type=movie&id={itemID}"
      episode: "/embed?type=tv&id={itemID}&season={season}&episode={episode}"

whisper:
  # Defaults to ggml-tiny.en (English only), downloaded once to your user cache; point it at a
  # multilingual model for other languages or auto.
  # model_path: ""

tmdb:
  # For the interactive `castor cast`; get a free key at https://www.themoviedb.org/settings/api.
  # Keep the real one in config.local.yaml (git-ignored) or CASTOR_TMDB__API_KEY.
  api_key: "<YOUR_TMDB_API_KEY>"

# The API server finds your devices and runs casts on them.
api:
  # One elsewhere on your network; unset (the default), each castor command runs its own.
  # url: http://my-nas:8411
  # Where `castor api` listens (default :8411, every interface).
  # listen: ":8411"
  # The token every request must carry; set it whenever this server listens on a network.
  # token: "<A_LONG_RANDOM_STRING>"

# The media server does the heavy work and serves your devices.
server:
  # One on another machine, such as a NAS; unset (the default), the API server runs its own.
  # url: http://my-nas:8410
  # The token its API asks for, the same here and on that machine.
  # token: "<A_LONG_RANDOM_STRING>"
  # Where `castor server` listens (default :8410, every interface).
  # listen: ":8410"
  # Where devices reach it, for a server outside their network (default: its own address).
  # advertise: http://castor.example.com:8410
